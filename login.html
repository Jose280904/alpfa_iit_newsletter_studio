<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC PAGE SETTINGS
         ===================================================== -->

    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Executive Board Login | ALPFA IIT</title>

    <!-- =====================================================
         MAIN STYLESHEET
         ===================================================== -->

    <!--
        We use the same stylesheet as the subscription page.
        Login-specific styles will be added to the bottom of it.
    -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <main class="login-page">

        <!-- =================================================
             LOGIN CARD
             ================================================= -->

        <section class="login-card">

            <!-- =============================================
                 ORGANIZATION HEADER
                 ============================================= -->

            <div class="organization-header">
                <p class="organization-label">
                    ILLINOIS INSTITUTE OF TECHNOLOGY
                </p>
                <h1>
                    ALPFA IIT
                </h1>
            </div>

            <!-- =============================================
                 LOGIN INTRODUCTION
                 ============================================= -->

            <div class="login-intro">
                <h2>
                    Executive Board Login
                </h2>
                <p>
                    Sign in to access the ALPFA IIT Newsletter
                    Studio.
                </p>
            </div>

            <!-- =============================================
                 LOGIN FORM
                 ============================================= -->

            <!--
                Later, auth.js will send these credentials to
                Google Apps Script.

                IMPORTANT:

                The real username/password are NOT stored in
                this HTML file or our JavaScript.

                Apps Script will check the credentials
                server-side.
            -->

            <form id="loginForm">

                <!-- =========================================
                     USERNAME
                     ========================================= -->

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>


                <!-- =========================================
                     PASSWORD
                     ========================================= -->

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <!--
                        Password wrapper allows us to place a
                        Show/Hide button inside the field.
                    -->

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <!--
                            This button will eventually be
                            controlled by auth.js.
                        -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- =========================================
                     LOGIN BUTTON
                     ========================================= -->

                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Log In
                </button>

                <!-- =========================================
                     LOGIN STATUS MESSAGE
                     ========================================= -->

                <!--
                    Examples:

                    "Incorrect username or password."

                    "Signing in..."

                    etc.
                -->

                <p
                    id="loginMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>

            <!-- =============================================
                 BACK TO SUBSCRIPTION PAGE
                 ============================================= -->

            <div class="back-link-container">
                <a href="index.html" class="back-link">
                    ← Back to Newsletter Signup
                </a>
            </div>
        </section>
    </main>

    <!-- =====================================================
         LOGIN JAVASCRIPT
         ===================================================== -->

    <!--
        auth.js will eventually:

        - Show/hide password
        - Submit login credentials
        - Communicate with Apps Script
        - Create an authenticated admin session
        - Redirect successful users to the dashboard
    -->

    <script src="js/auth.js"></script>

</body>

<!-- Central Web Services Footer -->
<footer class="cws-footer">
    Developed by <span>Central Web Services</span> &copy; 2026
</footer>

</html>
